version: "2"
linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - revive
    - staticcheck
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: cyclomatic
          arguments:
            - 20
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'SA9003:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
